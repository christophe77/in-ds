<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12161c"/>
      <stop offset="1" stop-color="#0c0f14"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1c2430" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#2b3440" stroke-width="2"/>

  <!-- brand mark -->
  <g transform="translate(80,84)">
    <rect x="0" y="0" width="52" height="52" rx="10" fill="#161b22" stroke="#2b3440" stroke-width="1.5"/>
    <circle cx="26" cy="26" r="11" fill="#16a34a"/>
    <circle cx="26" cy="26" r="11" fill="none" stroke="#4ade80" stroke-width="2"/>
    <circle cx="26" cy="26" r="18" fill="none" stroke="#16a34a" stroke-opacity="0.35" stroke-width="2"/>
    <text x="70" y="36" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="34" font-weight="600" fill="#e6edf3">ind-ds</text>
  </g>

  <!-- headline -->
  <text x="80" y="270" font-family="Segoe UI, system-ui, sans-serif" font-size="72" font-weight="700" fill="#f0f4f8">The open-source design</text>
  <text x="80" y="352" font-family="Segoe UI, system-ui, sans-serif" font-size="72" font-weight="700" fill="#f0f4f8">system for industrial software.</text>

  <!-- subline -->
  <text x="82" y="424" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="26" fill="#8b98a8">HMI · SCADA · Web Components · React · Vue · MQTT</text>

  <!-- component chips row -->
  <g transform="translate(80,486)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20">
    <g>
      <rect x="0" y="0" width="150" height="52" rx="8" fill="#12161c" stroke="#2b3440"/>
      <circle cx="26" cy="26" r="9" fill="#16a34a"/>
      <text x="46" y="33" fill="#c4ccd6">P-101</text>
    </g>
    <g transform="translate(170,0)">
      <rect x="0" y="0" width="150" height="52" rx="8" fill="#12161c" stroke="#2b3440"/>
      <circle cx="26" cy="26" r="9" fill="#f59e0b"/>
      <text x="46" y="33" fill="#c4ccd6">M-102</text>
    </g>
    <g transform="translate(340,0)">
      <rect x="0" y="0" width="150" height="52" rx="8" fill="#12161c" stroke="#2b3440"/>
      <circle cx="26" cy="26" r="9" fill="#dc2626"/>
      <text x="46" y="33" fill="#c4ccd6">XV-204</text>
    </g>
    <g transform="translate(510,0)">
      <rect x="0" y="0" width="210" height="52" rx="8" fill="#12161c" stroke="#7f1d1d"/>
      <rect x="14" y="16" width="22" height="20" rx="3" fill="#dc2626"/>
      <text x="16" y="31" fill="#fff" font-size="13" font-weight="700">HH</text>
      <text x="48" y="33" fill="#c4ccd6">Overtemp</text>
    </g>
  </g>

  <!-- value readout -->
  <g transform="translate(900,486)">
    <rect x="0" y="0" width="220" height="52" rx="8" fill="#12161c" stroke="#2b3440"/>
    <text x="18" y="24" font-family="ui-monospace, monospace" font-size="12" fill="#8b98a8">DISCHARGE</text>
    <text x="18" y="44" font-family="ui-monospace, monospace" font-size="22" font-weight="700" fill="#f0f4f8">4.2 <tspan font-size="14" fill="#8b98a8">bar</tspan></text>
  </g>

  <text x="1120" y="120" text-anchor="end" font-family="ui-monospace, monospace" font-size="20" fill="#5b6675">115 components · MIT</text>
</svg>

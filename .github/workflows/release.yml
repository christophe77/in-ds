name: Release

on:
  push:
    branches: [main]

# Don't let two releases run at once.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write       # commit the version bumps + tag
      pull-requests: write  # open the "Version Packages" PR
      id-token: write       # required for npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so Changesets can detect what changed since the last tag.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
          scope: '@ind-ds'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm publish token
        run: |
          npm whoami
          echo "Token can read @ind-ds scope. Publish will fail with E404 if the token lacks write access to the org."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Create Release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm provenance — attests the package was built from this commit
          # in this workflow. Shows up as a verified badge on npmjs.com.
          NPM_CONFIG_PROVENANCE: "true"

name: Storybook Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: storybook-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Build & deploy Storybook
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages (tokens → core → …)
        run: pnpm build --filter=@ind-ds/storybook...

      - name: Build Storybook for GitHub Pages
        run: pnpm --filter @ind-ds/storybook build
        env:
          STORYBOOK_BASE_PATH: /ind-ds/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/storybook/storybook-static

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
